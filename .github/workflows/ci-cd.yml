name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Spring
        uses: docker/build-push-action@v6
        with:
          context: ./springboot/app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/spring-app:${{ github.sha }}

      - name: Build & push Angular
        uses: docker/build-push-action@v6
        with:
          context: ./angular-app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/angular-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/angular-app:${{ github.sha }}

  # Déploiement sur le cluster LOCAL Docker Desktop :
  # nécessite un runner GitHub auto-hébergé installé sur ton PC
  # (Settings > Actions > Runners > New self-hosted runner).
  deploy:
    needs: build-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Créer le secret MySQL depuis GitHub Secrets
        shell: bash
        run: |
          kubectl create secret generic mysql-secret \
            --from-literal=MYSQL_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Appliquer les manifests
        shell: bash
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl apply -f k8s/spring-deployment.yaml
          kubectl apply -f k8s/angular-deployment.yaml

      - name: Mettre à jour les images (tag = commit)
        shell: bash
        run: |
          kubectl set image deployment/spring-deployment spring-app=${{ secrets.DOCKERHUB_USERNAME }}/spring-app:${{ github.sha }}
          kubectl set image deployment/angular-deployment angular-app=${{ secrets.DOCKERHUB_USERNAME }}/angular-app:${{ github.sha }}
          kubectl rollout status deployment/spring-deployment --timeout=180s
          kubectl rollout status deployment/angular-deployment --timeout=120s
